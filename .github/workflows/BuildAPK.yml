name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: true
        default: 'My App'
      package_name:
        description: 'Package name (e.g. com.example.myapp)'
        required: true
        default: 'com.example.myapp'
      website_url:
        description: 'URL website yang dibuka di WebView'
        required: true
        default: 'https://example.com'
      tagline:
        description: 'Tagline splash screen'
        required: false
        default: ''
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (e.g. 10)'
        required: true
        default: '10'
      splash_bg:
        description: 'Warna background splash (hex tanpa #)'
        required: false
        default: '0a1628'
      primary_color:
        description: 'Warna primary/accent (hex tanpa #)'
        required: false
        default: '0d9488'
      icon_url:
        description: 'URL icon APK (png/jpg, min 192x192)'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes 2>/dev/null | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;34.0.0"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_ENV
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> $GITHUB_ENV

      - name: Set Variables
        id: vars
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "pkg_path=$PKG_PATH" >> $GITHUB_OUTPUT
          APP_SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_')
          echo "apk_name=${APP_SAFE}_v${{ github.event.inputs.version_name }}_signed.apk" >> $GITHUB_OUTPUT

      - name: Prepare Directories
        run: |
          PKG_PATH="${{ steps.vars.outputs.pkg_path }}"
          mkdir -p source/src/${PKG_PATH}
          mkdir -p source/gen source/bin/classes source/bin/apk hasil
          mkdir -p source/res/drawable source/res/layout source/res/values source/res/xml
          mkdir -p source/res/mipmap-{hdpi,mdpi,xhdpi,xxhdpi,xxxhdpi}

      - name: Copy Static Template Files
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH="${{ steps.vars.outputs.pkg_path }}"
          URL="${{ github.event.inputs.website_url }}"
          cp template/res/layout/activity_main.xml source/res/layout/
          cp template/res/layout/activity_splash.xml source/res/layout/
          cp template/res/drawable/progress_bar.xml source/res/drawable/
          cp template/res/values/styles.xml source/res/values/
          cp template/src/MainActivity.java source/src/${PKG_PATH}/
          cp template/src/SplashActivity.java source/src/${PKG_PATH}/
          sed -i "s|__PACKAGE__|${PKG}|g" source/src/${PKG_PATH}/MainActivity.java
          sed -i "s|__PACKAGE__|${PKG}|g" source/src/${PKG_PATH}/SplashActivity.java
          sed -i "s|__WEBSITE_URL__|${URL}|g" source/src/${PKG_PATH}/MainActivity.java

      - name: Generate Dynamic Resource Files
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          DOMAIN=$(echo "${{ github.event.inputs.website_url }}" | sed 's|https\?://||' | sed 's|/.*||')
          cat > source/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}"
              android:versionCode="${{ github.event.inputs.version_code }}"
              android:versionName="${{ github.event.inputs.version_name }}">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="37" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".SplashActivity"
                      android:theme="@style/SplashTheme"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="false" />
              </application>
          </manifest>
          EOF
          cat > source/res/xml/network_security_config.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">${DOMAIN}</domain>
              </domain-config>
          </network-security-config>
          EOF
          cat > source/res/values/colors.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_bg">#${{ github.event.inputs.splash_bg }}</color>
              <color name="primary">#${{ github.event.inputs.primary_color }}</color>
              <color name="primary_dark">#${{ github.event.inputs.primary_color }}</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF
          APP_NAME=$(echo "${{ github.event.inputs.app_name }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&apos;/g')
          TAGLINE=$(echo "${{ github.event.inputs.tagline }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&apos;/g')
          VERSION=$(echo "${{ github.event.inputs.version_name }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          cat > source/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
              <string name="tagline">${TAGLINE}</string>
              <string name="version">Version ${VERSION}</string>
          </resources>
          EOF

      - name: Setup Icons
        run: |
          pip install pillow --quiet --break-system-packages
          INPUT_ICON="${{ github.event.inputs.icon_url }}"
          if [ -n "$INPUT_ICON" ]; then
            wget -q -O /tmp/ic_launcher_orig "$INPUT_ICON"
          else
            wget -q -O /tmp/ic_launcher_orig "https://via.placeholder.com/192/${{ github.event.inputs.primary_color }}/FFFFFF?text=APP"
          fi
          python3 - << 'EOF'
          from PIL import Image

          sizes = {
            "mdpi": 48,
            "hdpi": 72,
            "xhdpi": 96,
            "xxhdpi": 144,
            "xxxhdpi": 192
          }

          img = Image.open("/tmp/ic_launcher_orig").convert("RGBA")
          for density, size in sizes.items():
            resized = img.resize((size, size), Image.LANCZOS)
            resized.save(f"source/res/mipmap-{density}/ic_launcher.png")
            print(f"Generated {density}: {size}x{size}")
          EOF

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > rscoders.keystore

      - name: Generate R.java
        run: |
          $BUILD_TOOLS/aapt package -f -m \
            -J source/gen \
            -M source/AndroidManifest.xml \
            -S source/res \
            -I $ANDROID_JAR

      - name: Compile Java
        run: |
          JAVA_FILES=$(find source/src source/gen -type f -name "*.java")
          javac --release 8 \
            -d source/bin/classes \
            -classpath source/src:source/gen:$ANDROID_JAR \
            $JAVA_FILES

      - name: Convert to DEX
        run: |
          $BUILD_TOOLS/d8 \
            $(find source/bin/classes -name "*.class") \
            --output source/bin/apk/

      - name: Package Resources
        run: |
          $BUILD_TOOLS/aapt package -f \
            -I $ANDROID_JAR \
            -S source/res \
            -M source/AndroidManifest.xml \
            -F source/bin/apk/unaligned.apk
          cd source/bin/apk
          $BUILD_TOOLS/aapt add -f unaligned.apk classes.dex

      - name: Zipalign
        run: |
          $BUILD_TOOLS/zipalign -f 4 \
            source/bin/apk/unaligned.apk \
            source/bin/apk/aligned.apk

      - name: Sign APK
        id: sign
        run: |
          APK_NAME="${{ steps.vars.outputs.apk_name }}"
          $BUILD_TOOLS/apksigner sign \
            --ks rscoders.keystore \
            --ks-key-alias rscoders \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "hasil/${APK_NAME}" \
            source/bin/apk/aligned.apk
          echo "apk_path=hasil/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: ${{ steps.sign.outputs.apk_path }}
          retention-days: 7
          